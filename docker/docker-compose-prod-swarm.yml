version: "3.7"

services:
  db:
    image: postgres:15-alpine
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    volumes:
      - autoserver_db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - network_swarm_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M

  backend:
    image: aryalvesfernandes/oraculo:backend-1.0.7
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    volumes:
      - autoserver_backend_data:/app/data
      - autoserver_stacks_backups:/app/stacks_backups
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - network_swarm_public
    depends_on:
      - db
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 2048M
      labels:
        - traefik.enable=true
        - traefik.http.routers.autoserver-backend.rule=Host(`${BACKEND_DOMAIN}`)
        - traefik.http.routers.autoserver-backend.entrypoints=websecure
        - traefik.http.routers.autoserver-backend.tls.certresolver=letsencryptresolver
        - traefik.http.routers.autoserver-backend.service=autoserver-backend
        - traefik.http.services.autoserver-backend.loadbalancer.server.port=8000
        - traefik.http.services.autoserver-backend.loadbalancer.passHostHeader=true

  frontend:
    image: aryalvesfernandes/oraculo:frontend-1.0.7
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    environment:
      - VITE_API_URL=https://${BACKEND_DOMAIN}
    networks:
      - network_swarm_public
    depends_on:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.autoserver-frontend.rule=Host(`${FRONTEND_DOMAIN}`)
        - traefik.http.routers.autoserver-frontend.entrypoints=websecure
        - traefik.http.routers.autoserver-frontend.tls.certresolver=letsencryptresolver
        - traefik.http.routers.autoserver-frontend.service=autoserver-frontend
        - traefik.http.services.autoserver-frontend.loadbalancer.server.port=5505
        - traefik.http.services.autoserver-frontend.loadbalancer.passHostHeader=true

volumes:
  autoserver_db_data:
    external: true
    name: autoserver_db_data
  autoserver_backend_data:
    external: true
    name: autoserver_backend_data
  autoserver_stacks_backups:
    external: true
    name: autoserver_stacks_backups

networks:
  network_swarm_public:
    name: network_swarm_public
    external: true
