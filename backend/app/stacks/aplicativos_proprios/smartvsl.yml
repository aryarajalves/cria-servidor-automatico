version: "3.8"

services:
  # ============================================================================
  # Backend API (FastAPI + SQLAlchemy + Uvicorn Multi-Workers)
  # ============================================================================
  backend:
    image: aryalvesfernandes/clone-vturb:backend-1.1.4
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - network_swarm_public
    environment:
      - DATABASE_URL=postgresql://postgres:{Senha_Postgres}@postgres:5432/{DB_NAME}
      
      - SUPER_ADMIN_EMAIL={SUPER_ADMIN_EMAIL}
      - SUPER_ADMIN_PASSWORD={SUPER_ADMIN_PASSWORD}
      
      - JWT_SECRET_KEY={JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRE_HOURS=24h
      
      - BACKBLAZE_KEY_ID={BACKBLAZE_KEY_ID}
      - BACKBLAZE_APPLICATION_KEY={BACKBLAZE_APPLICATION_KEY}
      - BACKBLAZE_BUCKET_NAME={BACKBLAZE_BUCKET_NAME}
      - BACKBLAZE_ENDPOINT_URL={BACKBLAZE_ENDPOINT_URL}
      - BACKBLAZE_CDN_URL={BACKBLAZE_CDN_URL}
      
      - BREVO_API_KEY={BREVO_API_KEY}
      - BREVO_SENDER_EMAIL={BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME="SmartVSL"
      
      - VITE_API_BASE_URL=https://{BACKEND_DOMAIN}
    volumes:
      - backend_uploads:/app/static/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.vturb_backend.rule=Host(`{BACKEND_DOMAIN}`)
        - traefik.http.routers.vturb_backend.entrypoints=websecure
        - traefik.http.routers.vturb_backend.tls.certresolver=letsencryptresolver
        - traefik.http.routers.vturb_backend.service=vturb_backend
        - traefik.http.services.vturb_backend.loadbalancer.server.port=8000
        - traefik.http.services.vturb_backend.loadbalancer.passhostheader=true
        - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.vturb_backend.middlewares=sslheader@docker

  # ============================================================================
  # Frontend SPA (React + Vite + Nginx Alpine)
  # ============================================================================
  frontend:
    image: aryalvesfernandes/clone-vturb:frontend-1.1.4
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - network_swarm_public
    environment:
      - DATABASE_URL=postgresql://postgres:{Senha_Postgres}@postgres:5432/{DB_NAME}
      
      - SUPER_ADMIN_EMAIL={SUPER_ADMIN_EMAIL}
      - SUPER_ADMIN_PASSWORD={SUPER_ADMIN_PASSWORD}
      
      - JWT_SECRET_KEY={JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRE_HOURS=24h
      
      - BACKBLAZE_KEY_ID={BACKBLAZE_KEY_ID}
      - BACKBLAZE_APPLICATION_KEY={BACKBLAZE_APPLICATION_KEY}
      - BACKBLAZE_BUCKET_NAME={BACKBLAZE_BUCKET_NAME}
      - BACKBLAZE_ENDPOINT_URL={BACKBLAZE_ENDPOINT_URL}
      - BACKBLAZE_CDN_URL={BACKBLAZE_CDN_URL}
      
      - BREVO_API_KEY={BREVO_API_KEY}
      - BREVO_SENDER_EMAIL={BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME="SmartVSL"
      
      - VITE_API_BASE_URL=https://{BACKEND_DOMAIN}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.vturb_frontend.rule=Host(`{FRONTEND_DOMAIN}`)
        - traefik.http.routers.vturb_frontend.entrypoints=websecure
        - traefik.http.routers.vturb_frontend.tls.certresolver=letsencryptresolver
        - traefik.http.routers.vturb_frontend.service=vturb_frontend
        - traefik.http.services.vturb_frontend.loadbalancer.server.port=80
        - traefik.http.services.vturb_frontend.loadbalancer.passhostheader=true
        - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.vturb_frontend.middlewares=sslheader@docker

volumes:
  backend_uploads:
    name: vturb_backend_uploads_prod

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
