version: '3.8'

services:

  worker:
    image: aryarajalves/configurar-agentes-ia:backend-1.7.6
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    command: celery -A celery_app worker --loglevel=info --concurrency=1
    networks:
      - network_swarm_public
    environment:
      # --- Banco de Dados e Concorrência ---
      - DATABASE_URL=postgresql+asyncpg://postgres:a12470a9-e3a2-4c21-a9f3-d8b4ca8cb205@postgres_postgres:5432/ai_agent # URL de conexão ao PostgreSQL (Externo)
      - GUNICORN_WORKERS=4 # Ajustado para 5 workers (Ideal para 2 CPUs)
            
      - FRONTEND_URL=https://{DOMAIN_FRONTEND}
      
      - OPENAI_API_KEY= # Chave para geração de texto (GPT) e embeddings (OpenAI)84480986-b34c-4150-89f6-e48d8db16ca5
      - GEMINI_API_KEY= # Chave para modelos Google Gemini (Alternativo)
      - ANTHROPIC_API_KEY=
      - ASSEMBLYAI_API_KEY=

      # Autenticação do endpoint /execute para o N8N
      - AGENT_API_KEY={AGENT_API_KEY} # Senha master da API. Usada pelo N8N, Chat e Webhooks para usar o endpoint /execute.
      
      # --- Google Calendar (Opcional) ---
      - GOOGLE_CLIENT_ID={GOOGLE_CLIENT_ID} # ID da credencial OAuth do painel Google Cloud
      - GOOGLE_CLIENT_SECRET={GOOGLE_CLIENT_SECRET} # Secret da credencial OAuth
      - GOOGLE_REDIRECT_URI={GOOGLE_REDIRECT_URI} # URL de retorno exata após o usuário fazer login no Google

      # Admin Access
      - ADMIN_EMAIL=aryarajmarketing@gmail.com # E-mail do usuário Super Administrador do painel
      - ADMIN_PASSWORD=123456 # Senha do usuário Super Administrador
      - CORS_ALLOWED_ORIGINS=https://{DOMAIN_FRONTEND},http://localhost:5300 # Proteção do navegador. Lista de domínios (ex: https://meusite.com) autorizados a se comunicar.
      - JWT_SECRET_KEY=d8e4125b-c290-48a1-b8d4-53c8f1e67890 # Assinat ura criptográfica dos tokens de Login. Mantém administradores logados de forma segura.

      # --- CONFIGURAÇÕES DE STORAGE (S3/Backblaze) ---
      - S3_ENDPOINT_URL=https://s3.us-west-004.backblazeb2.com
      - S3_ACCESS_KEY=0047daba280ace40000000015
      - S3_SECRET_KEY=K0042w9BmxfZEalmYf7l7/jQ8eunT8s
      - S3_BUCKET_NAME=zap-voice
      - S3_REGION=us-east-005


      # --- CONFIGURAÇÕES DE QUEUE (Redis/Celery) ---
      - REDIS_URL=redis://redis:6379/8
 
      # --- LIMITES ---
      - MAX_CONTENT_LENGTH=5368709120 # 5GB em bytes

      - CHATWOOT_URL={Chatwoot_Url}
      - CHATWOOT_API_TOKEN={Chatwoot_Token}

      - PYTHONPATH=/app


      - VITE_API_URL={VITE_API_URL}
      - VITE_AGENT_API_KEY={VITE_AGENT_API_KEY}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  # ----------------------------------------------------------
  # BACKEND — FastAPI + Gunicorn
  # ----------------------------------------------------------
  backend:
    image: aryarajalves/configurar-agentes-ia:backend-1.7.6
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - network_swarm_public
    environment:
      # --- Banco de Dados e Concorrência ---
      - DATABASE_URL=postgresql+asyncpg://postgres:a12470a9-e3a2-4c21-a9f3-d8b4ca8cb205@postgres_postgres:5432/ai_agent # URL de conexão ao PostgreSQL (Externo)
      - GUNICORN_WORKERS=4 # Ajustado para 5 workers (Ideal para 2 CPUs)
            
      - FRONTEND_URL=https://{DOMAIN_FRONTEND}
      
      - OPENAI_API_KEY= # Chave para geração de texto (GPT) e embeddings (OpenAI)84480986-b34c-4150-89f6-e48d8db16ca5
      - GEMINI_API_KEY= # Chave para modelos Google Gemini (Alternativo)
      - ANTHROPIC_API_KEY=
      - ASSEMBLYAI_API_KEY=

      # Autenticação do endpoint /execute para o N8N
      - AGENT_API_KEY={AGENT_API_KEY} # Senha master da API. Usada pelo N8N, Chat e Webhooks para usar o endpoint /execute.
      
      # --- Google Calendar (Opcional) ---
      - GOOGLE_CLIENT_ID={GOOGLE_CLIENT_ID} # ID da credencial OAuth do painel Google Cloud
      - GOOGLE_CLIENT_SECRET={GOOGLE_CLIENT_SECRET} # Secret da credencial OAuth
      - GOOGLE_REDIRECT_URI={GOOGLE_REDIRECT_URI} # URL de retorno exata após o usuário fazer login no Google

      # Admin Access
      - ADMIN_EMAIL=aryarajmarketing@gmail.com # E-mail do usuário Super Administrador do painel
      - ADMIN_PASSWORD=123456 # Senha do usuário Super Administrador
      - CORS_ALLOWED_ORIGINS=https://{DOMAIN_FRONTEND},http://localhost:5300 # Proteção do navegador. Lista de domínios (ex: https://meusite.com) autorizados a se comunicar.
      - JWT_SECRET_KEY=d8e4125b-c290-48a1-b8d4-53c8f1e67890 # Assinat ura criptográfica dos tokens de Login. Mantém administradores logados de forma segura.

      # --- CONFIGURAÇÕES DE STORAGE (S3/Backblaze) ---
      - S3_ENDPOINT_URL=https://s3.us-west-004.backblazeb2.com
      - S3_ACCESS_KEY=0047daba280ace40000000015
      - S3_SECRET_KEY=K0042w9BmxfZEalmYf7l7/jQ8eunT8s
      - S3_BUCKET_NAME=zap-voice
      - S3_REGION=us-east-005


      # --- CONFIGURAÇÕES DE QUEUE (Redis/Celery) ---
      - REDIS_URL=redis://redis:6379/8
 
      # --- LIMITES ---
      - MAX_CONTENT_LENGTH=5368709120 # 5GB em bytes

      - CHATWOOT_URL={Chatwoot_Url}
      - CHATWOOT_API_TOKEN={Chatwoot_Token}

      - PYTHONPATH=/app


      - VITE_API_URL={VITE_API_URL}
      - VITE_AGENT_API_KEY={VITE_AGENT_API_KEY}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 2048M
      labels:
        - traefik.enable=true
        - traefik.http.routers.agentes_backend.rule=Host(`{DOMAIN_BACKEND}`)
        - traefik.http.routers.agentes_backend.entrypoints=websecure
        - traefik.http.routers.agentes_backend.tls.certresolver=letsencryptresolver
        - traefik.http.routers.agentes_backend.service=agentes_backend
        - traefik.http.services.agentes_backend.loadbalancer.server.port=8000
        - traefik.http.services.agentes_backend.loadbalancer.passhostheader=true
        - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.agentes_backend.middlewares=sslheader@docker

  # ----------------------------------------------------------
  # FRONTEND — React (build estático) + Nginx
  # ----------------------------------------------------------
  frontend:
    image: aryarajalves/configurar-agentes-ia:frontend-1.7.6
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - network_swarm_public

    environment:
      # --- Banco de Dados e Concorrência ---
      - DATABASE_URL=postgresql+asyncpg://postgres:a12470a9-e3a2-4c21-a9f3-d8b4ca8cb205@postgres_postgres:5432/ai_agent # URL de conexão ao PostgreSQL (Externo)
      - GUNICORN_WORKERS=4 # Ajustado para 5 workers (Ideal para 2 CPUs)
            
      - FRONTEND_URL=https://{DOMAIN_FRONTEND}
      
      - OPENAI_API_KEY= # Chave para geração de texto (GPT) e embeddings (OpenAI)84480986-b34c-4150-89f6-e48d8db16ca5
      - GEMINI_API_KEY= # Chave para modelos Google Gemini (Alternativo)
      - ANTHROPIC_API_KEY=
      - ASSEMBLYAI_API_KEY=

      # Autenticação do endpoint /execute para o N8N
      - AGENT_API_KEY={AGENT_API_KEY} # Senha master da API. Usada pelo N8N, Chat e Webhooks para usar o endpoint /execute.
      
      # --- Google Calendar (Opcional) ---
      - GOOGLE_CLIENT_ID={GOOGLE_CLIENT_ID} # ID da credencial OAuth do painel Google Cloud
      - GOOGLE_CLIENT_SECRET={GOOGLE_CLIENT_SECRET} # Secret da credencial OAuth
      - GOOGLE_REDIRECT_URI={GOOGLE_REDIRECT_URI} # URL de retorno exata após o usuário fazer login no Google

      # Admin Access
      - ADMIN_EMAIL=aryarajmarketing@gmail.com # E-mail do usuário Super Administrador do painel
      - ADMIN_PASSWORD=123456 # Senha do usuário Super Administrador
      - CORS_ALLOWED_ORIGINS=https://{DOMAIN_FRONTEND},http://localhost:5300 # Proteção do navegador. Lista de domínios (ex: https://meusite.com) autorizados a se comunicar.
      - JWT_SECRET_KEY=d8e4125b-c290-48a1-b8d4-53c8f1e67890 # Assinat ura criptográfica dos tokens de Login. Mantém administradores logados de forma segura.

      # --- CONFIGURAÇÕES DE STORAGE (S3/Backblaze) ---
      - S3_ENDPOINT_URL=https://s3.us-west-004.backblazeb2.com
      - S3_ACCESS_KEY=0047daba280ace40000000015
      - S3_SECRET_KEY=K0042w9BmxfZEalmYf7l7/jQ8eunT8s
      - S3_BUCKET_NAME=zap-voice
      - S3_REGION=us-east-005


      # --- CONFIGURAÇÕES DE QUEUE (Redis/Celery) ---
      - REDIS_URL=redis://redis:6379/8
 
      # --- LIMITES ---
      - MAX_CONTENT_LENGTH=5368709120 # 5GB em bytes

      - CHATWOOT_URL={Chatwoot_Url}
      - CHATWOOT_API_TOKEN={Chatwoot_Token}

      - PYTHONPATH=/app


      - VITE_API_URL={VITE_API_URL}
      - VITE_AGENT_API_KEY={VITE_AGENT_API_KEY}

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.agentes_frontend.rule=Host(`{DOMAIN_FRONTEND}`)
        - traefik.http.routers.agentes_frontend.entrypoints=websecure
        - traefik.http.routers.agentes_frontend.tls.certresolver=letsencryptresolver
        - traefik.http.routers.agentes_frontend.service=agentes_frontend
        - traefik.http.services.agentes_frontend.loadbalancer.server.port=80
        - traefik.http.services.agentes_frontend.loadbalancer.passhostheader=true
        - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.agentes_frontend.middlewares=sslheader@docker

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
