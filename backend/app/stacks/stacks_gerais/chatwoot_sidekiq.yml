services:
  # Definição do Nome do Serviço de Background
  chatwoot_sidekiq:
    # imagem oficial do chatwoot
    image: chatwoot/chatwoot:v3.13.0
    # Define o hotname do container
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    # comando padrão para subir o servidor web
    command: bundle exec sidekiq -C config/sidekiq.yml
    # configura os volumes do chatwoot (compartilhado)
    volumes:
      - chatwoot_data:/app/storage # arquivos do usuário
    # configura a rede do serviço
    networks:
      - network_swarm_public
    environment:
      ##########################################
      # Nome do Setup
      ##########################################
      - INSTALLATION_NAME={INSTALLATION_NAME}
      # Ambiente de Execução do Node
      - NODE_ENV=production
      # Ambiente de Execução do Rails
      - RAILS_ENV=production
      # Tipo de Instalação
      - INSTALLATION_ENV=docker
      # Chave de Segurança
      - SECRET_KEY_BASE={Secret_Key_Base}
      # URL do Frontend
      - FRONTEND_URL=https://{BaseUrl_Chatwoot}
      # Configura o idioma padrão
      - DEFAULT_LOCALE=pt_BR
      # Configura o SSL
      - FORCE_SSL=true
      # Configura a criação de novas contas
      - ENABLE_ACCOUNT_SIGNUP=true
      # Permite usar Gmail/Hotmail
      - DISABLE_STRICT_PROFESSIONAL_EMAIL_VALIDATION=true
      # Configura o Log
      - RAILS_LOG_TO_STDOUT=true
      # Configura o Avatar do Bot
      - USE_INBOX_AVATAR_FOR_BOT=true
      ##########################################
      # Configura o Redis
      ##########################################
      # Configura o Redis
      - REDIS_URL=redis://redis:6379/{REDIS_DB}
      # Se você habilitou a senha do redis
      # - REDIS_PASSWORD=
      ##########################################
      # Configura o Banco de Dados
      ##########################################
      # Configura o endereço do Postgres ou PgBouncer
      - POSTGRES_HOST=postgres
      # Configura o Usuário do Postgres
      - POSTGRES_USERNAME=postgres
      # Configura a Senha do Postgres
      - POSTGRES_PASSWORD={Senha_Postgres}
      # Configura o Banco de Dados do Postgres
      - POSTGRES_DATABASE={POSTGRES_DATABASE}
      ##########################################
      # Configurações do Email
      # Endereço de Remetente
      - SMTP_USERNAME=your_smtp_username
      - SMTP_PASSWORD=your_smtp_password
      - SMTP_PORT=587
      - SMTP_ADDRESS=smtp-relay.brevo.com
      - SMTP_ENABLE_STARTTLS_AUTO=true
      - SMTP_AUTHENTICATION=plain
      - MAILER_SENDER_EMAIL=your_sender_email
      ##########################################
      # Configura o S3 (Backblaze B2)
      ##########################################
      # Seleciona o Tipo de Storage
      - ACTIVE_STORAGE_SERVICE=amazon
      # Nome do Bucket no Backblaze
      - S3_BUCKET_NAME={Backblaze_Bucket_Name}
      # Credenciais do Backblaze (S3 Compatible)
      - S3_ACCESS_KEY_ID={Backblaze_Key_ID}
      - S3_SECRET_ACCESS_KEY={Backblaze_Application_Key}
      - S3_REGION={Backblaze_Region}
      - S3_ENDPOINT={Backblaze_Endpoint}
      - S3_FORCE_PATH_STYLE=true
      # Fallbacks Globais para o SDK da AWS
      - AWS_REGION={Backblaze_Region}
      - AWS_DEFAULT_REGION={Backblaze_Region}
      - AWS_ACCESS_KEY_ID={Backblaze_Key_ID}
      - AWS_SECRET_ACCESS_KEY={Backblaze_Application_Key}
    # Configura o Modo de Deploy da Aplicação
    deploy:
      mode: replicated # sempre como replicated
      replicas: 1 # geralmente somente 1 réplica
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          # Define a quantidade de CPU para o CodeChat para evitar travamento do Host
          cpus: "1"
          # Define a quantidade de RAM para o CodeChat para evitar travamento do Host
          memory: 2048M

volumes:
  chatwoot_data:
    external: true
    name: {VOLUME_NAME}

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public