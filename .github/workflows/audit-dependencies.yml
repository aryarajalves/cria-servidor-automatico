name: Auditoria de Segurança de Dependências

# Executa automaticamente sempre que houver push ou pull request na branch main, ou disparo manual
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-dependencies:
    name: Auditar Bibliotecas Externas (Backend & Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Configurar Ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Instalar pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Executar Auditoria de Dependências
        run: |
          python backend/scripts/audit_dependencies.py --github-summary --output-file audit-report.md
        continue-on-error: true

      - name: Armazenar Relatório de Auditoria como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-auditoria-dependencias
          path: audit-report.md
          retention-days: 30
