name: autoserver

services:
  db:
    image: postgres:15-alpine
    container_name: autoserver-db
    ports:
      - "5439:5432"
    environment:
      - POSTGRES_DB=autoserver
      - POSTGRES_USER=autoserver_user
      - POSTGRES_PASSWORD=autoserver_password
    volumes:
      - ../backend/data/postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: autoserver-backend
    ports:
      - "8005:8000"
    volumes:
      - ../backend:/app
      - ../stacks_backups:/app/stacks_backups
      - /app/__pycache__
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=autoserver
      - DB_USER=autoserver_user
      - DB_PASSWORD=autoserver_password
    env_file:
      - ../backend/.env
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: autoserver-frontend
    ports:
      - "5505:5505"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8005
    command: npm run dev -- --host --port 5505
